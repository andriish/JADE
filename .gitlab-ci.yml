---
stages:
  - images
  - test
variables:
  # jadetest.sh fails if a test fails, or is skipped
  JADE_FAIL_ON_SKIP: "1"
########################################################################
# Fedora 45 images and tests: the same logic as the GitHub workflows
# .github/workflows/fedora45*_gnu.yml. Each image is built from Dockerfile_fedora45<arch>_gnu
# with Kaniko (as in the CI of Sherpa) and pushed to the registry of the project as
# $CI_REGISTRY_IMAGE:fedora45<arch>_gnu: on a schedule, by hand (web) and on a push to any
# branch or a merge request that changes the Dockerfile. All branches publish the same
# tags (no suffixes), the last push wins. The test jobs run
#   sh jadeinstall.sh --bits=N && sh jadetest.sh --bits=N
# in that image. aarch64 jobs need a runner with the tag arm64.
########################################################################
.Fedora45image: &Fedora45image
  stage: images
  # Kaniko is archived upstream, so its last release is pinned
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  variables:
    GIT_DEPTH: "1"
  retry: 2
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile Dockerfile_$IMG --destination $CI_REGISTRY_IMAGE:${IMG}
########################################################################
.Fedora45test: &Fedora45test
  stage: test
  image: $CI_REGISTRY_IMAGE:${IMG}
########################################################################
image-fedora45x86_64_gnu:
  <<: *Fedora45image
  variables:
    IMG: fedora45x86_64_gnu
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web)$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Dockerfile_fedora45x86_64_gnu
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - Dockerfile_fedora45x86_64_gnu
########################################################################
fedora45x86_64_gnu:
  <<: *Fedora45test
  variables:
    IMG: fedora45x86_64_gnu
  needs:
    - job: image-fedora45x86_64_gnu
      optional: true
  rules:
    - when: on_success
  script:
    - sh jadeinstall.sh --bits=64
    - sh jadetest.sh --bits=64
########################################################################
image-fedora45x86_64i686_gnu:
  <<: *Fedora45image
  variables:
    IMG: fedora45x86_64i686_gnu
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web)$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Dockerfile_fedora45x86_64i686_gnu
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - Dockerfile_fedora45x86_64i686_gnu
########################################################################
# 32 bit (i686) on x86_64. As on GitHub, the default seccomp profile of Docker rejects the
# 32 bit socket() syscall of the current glibc, so that a 32 bit X11 client (jadez) cannot
# connect to the X server: the runner has to run the job container with
# --security-opt seccomp=unconfined (runner configuration), otherwise the display tests fail.
# Like on GitHub this job is started by hand (the automatic run is disabled there).
fedora45x86_64i686_gnu:
  <<: *Fedora45test
  variables:
    IMG: fedora45x86_64i686_gnu
  needs:
    - job: image-fedora45x86_64i686_gnu
      optional: true
  rules:
    - when: manual
      allow_failure: true
  script:
    - sh jadeinstall.sh --bits=32
    - sh jadetest.sh --bits=32
########################################################################
image-fedora45aarch64_gnu:
  <<: *Fedora45image
  tags:
    - arm64
  variables:
    IMG: fedora45aarch64_gnu
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web)$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Dockerfile_fedora45aarch64_gnu
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - Dockerfile_fedora45aarch64_gnu
########################################################################
fedora45aarch64_gnu:
  <<: *Fedora45test
  tags:
    - arm64
  variables:
    IMG: fedora45aarch64_gnu
  needs:
    - job: image-fedora45aarch64_gnu
      optional: true
  rules:
    - when: on_success
  script:
    - sh jadeinstall.sh --bits=64
    - sh jadetest.sh --bits=64
########################################################################
# s390x (big-endian) emulated with QEMU, see Dockerfile_fedora45s390x_gnu and
# .github/workflows/fedora45s390x_gnu.yml. Kaniko cannot build for another architecture, so
# docker-in-docker is used here. Slow (hours), failures are allowed. It needs a runner that
# allows privileged docker-in-docker (the binfmt handlers are installed with
# tonistiigi/binfmt) and is started by a schedule, by hand, or by hand after a change of the
# Dockerfile.
.Fedora45s390x: &Fedora45s390x
  image: docker:27
  services:
    - docker:27-dind
  timeout: 6h
  allow_failure: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt --install s390x
########################################################################
image-fedora45s390x_gnu:
  <<: *Fedora45s390x
  stage: images
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web)$/'
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - Dockerfile_fedora45s390x_gnu
      when: manual
  script:
    - docker build --platform linux/s390x . -f Dockerfile_fedora45s390x_gnu --tag $CI_REGISTRY_IMAGE:fedora45s390x_gnu
    - docker push $CI_REGISTRY_IMAGE:fedora45s390x_gnu
########################################################################
fedora45s390x_gnu:
  <<: *Fedora45s390x
  stage: test
  needs:
    - job: image-fedora45s390x_gnu
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web)$/'
    - when: manual
  script:
    - docker create --platform linux/s390x --name jadetest $CI_REGISTRY_IMAGE:fedora45s390x_gnu sh -c 'cd /home && uname -m && python3 -c "import sys; print(sys.byteorder)" ; sh jadeinstall.sh --bits=64 ; sh jadetest.sh --bits=64 --timeout-factor=20'
    - docker cp . jadetest:/home
    - docker start -a jadetest
########################################################################
