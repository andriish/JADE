name: Fedora 45 s390x (GNU, big-endian, QEMU)
# A big-endian machine (s390x) emulated with QEMU on an x86_64 runner: a check of the
# endianness assumptions of the software. The emulation is slow (the image build and the
# tests take hours); some commands may fail (missing packages for s390x, test time limits)
# and that does not fail the workflow. It runs on request and on a schedule.
on:
 workflow_dispatch:
 schedule:
    - cron:  "0 0 1/600 * *"

jobs:
  build-JADE-docker-image-fedora45s390x_gnu:
    runs-on: ubuntu-24.04
    name: Build JADE Docker image fedora45s390x_gnu
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: s390x
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push the image (s390x, emulated)
      continue-on-error: true
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile_fedora45s390x_gnu
        platforms: linux/s390x
        push: true
        tags: ghcr.io/andriish/fedora45s390x_gnu:latest

  fedora45s390x_gnu:
    name: fedora45s390x_gnu
    runs-on: ubuntu-24.04
    needs: build-JADE-docker-image-fedora45s390x_gnu
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: s390x
    - name: Compile and test on s390x (emulated)
      continue-on-error: true
      run: |
           docker run --rm --platform linux/s390x -v "$PWD":/home -w /home \
               ghcr.io/andriish/fedora45s390x_gnu:latest \
               sh -c 'uname -m; lscpu | grep -i "byte order"; sh jadeinstall.sh --bits=64; sh jadetest.sh --bits=64'
