name: CentOS Stream 10 x86_64 (GNU)
on:
 push:
 pull_request:
 workflow_dispatch:
 schedule:
#Every 50 days at midnight 
    - cron:  "0 0 1/600 * *"


jobs:
  centos10x86_64_gnu:
    name: centos10x86_64_gnu
    runs-on: ubuntu-latest
    needs: build-JADE-docker-image-centos10x86_64_gnu
    container:
        image: ghcr.io/andriish/centos10x86_64_gnu:latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Compile
      run: |
           sh jadeinstall.sh --bits=64
           sh jadetest.sh --bits=64

  build-JADE-docker-image-centos10x86_64_gnu:
    runs-on: ubuntu-latest
    name: Build JADE Docker image centos10x86_64_gnu
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
          fetch-depth: 2 
    - name: Check if the Docker file was changed
      id: changed-docker-files
      uses: tj-actions/changed-files@v38
      with:
          files: Dockerfile_centos10x86_64_gnu

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build the JADE Docker image on the change of Dockerfile
      if: steps.changed-docker-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
      run: |
         docker build . -f Dockerfile_centos10x86_64_gnu --tag ghcr.io/andriish/centos10x86_64_gnu:latest
         docker run ghcr.io/andriish/centos10x86_64_gnu:latest
         docker push ghcr.io/andriish/centos10x86_64_gnu:latest
    - name: Build the JADE Docker image on schedule
      if: ${{ github.event_name == 'schedule' }}
      run: |
         docker build . -f Dockerfile_centos10x86_64_gnu  --tag ghcr.io/andriish/centos10x86_64_gnu:latest
         docker run ghcr.io/andriish/centos10x86_64_gnu:latest
         docker push ghcr.io/andriish/centos10x86_64_gnu:latest
