name: Fedora 45 i686 on x86_64 (GNU)
# TEMPORARILY DISABLED: the automatic triggers are commented out, the workflow can still be started by hand
on:
# push:
# pull_request:
 workflow_dispatch:
# schedule:
#Every 50 days at midnight 
#    - cron:  "0 0 1/600 * *"


jobs:
  fedora45x86_64i686_gnu:
    name: fedora45x86_64i686_gnu
    runs-on: ubuntu-latest
    needs: build-JADE-docker-image-fedora45x86_64i686_gnu
    container:
        image: ghcr.io/andriish/fedora45x86_64i686_gnu:latest
        # Docker's default seccomp profile on the runner rejects the direct 32 bit socket()
        # syscall of the current glibc with ENOSYS: a 32 bit X11 client (jadez) then cannot
        # connect to the X server (ixsync crashes on the null display)
        options: --security-opt seccomp=unconfined
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Compile
      run: |
           cmake -S . -B buildGNU32 -DJADE_BITS=32 && cmake --build buildGNU32 --parallel 2 && cmake --install buildGNU32
           cmake -S test -B buildGNU32/test -DJADE_DIR=$PWD/installedGNU32 && cmake --build buildGNU32/test --parallel 2 && cd buildGNU32/test && ctest --timeout 200 --output-on-failure

  build-JADE-docker-image-fedora45x86_64i686_gnu:
    runs-on: ubuntu-latest
    name: Build JADE Docker image fedora45x86_64i686_gnu
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
          fetch-depth: 2 
    - name: Check if the Docker file was changed
      id: changed-docker-files
      uses: tj-actions/changed-files@v38
      with:
          files: Dockerfile_fedora45x86_64i686_gnu

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build the JADE Docker image on the change of Dockerfile
      if: steps.changed-docker-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
      run: |
         docker build . -f Dockerfile_fedora45x86_64i686_gnu --tag ghcr.io/andriish/fedora45x86_64i686_gnu:latest
         docker run ghcr.io/andriish/fedora45x86_64i686_gnu:latest
         docker push ghcr.io/andriish/fedora45x86_64i686_gnu:latest
    - name: Build the JADE Docker image on schedule
      if: ${{ github.event_name == 'schedule' }}
      run: |
         docker build . -f Dockerfile_fedora45x86_64i686_gnu  --tag ghcr.io/andriish/fedora45x86_64i686_gnu:latest
         docker run ghcr.io/andriish/fedora45x86_64i686_gnu:latest
         docker push ghcr.io/andriish/fedora45x86_64i686_gnu:latest
