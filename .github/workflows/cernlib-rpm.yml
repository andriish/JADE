name: CERNLIB RPMs (Fedora 45, dnf repository)
# Builds the CERNLIB RPMs of .github/rpm/cernlib in the default images of Fedora 45 (x86_64, i686, aarch64)
# and CentOS Stream 9 and 10 (x86_64, aarch64; CentOS has no i686), and publishes them as a dnf repository
# on GitHub Pages: https://<owner>.github.io/<repository>/ with fedora/<release>/<arch>/ and centos/<release>/<arch>/
# and the repository files JADE-fedora.repo and JADE-centos.repo (copy the one of the distribution to /etc/yum.repos.d/)
# One-time setting of the repository: Settings -> Pages -> Source: "GitHub Actions".
# It runs when the spec file changes (a change of a patch comes with a new release in the spec file) and on request
# (workflow_dispatch), on every branch and in pull requests. Everything is built everywhere; the repository is
# published to GitHub Pages only from the default branch (the site is one repository, and the environment
# github-pages normally accepts deployments only from the default branch), or by a manual run with "publish".
# A manual run can select the distribution and the architecture; publishing such a run replaces the whole site
# by the selected builds.
# s390x (emulated with QEMU, slow) is disabled so far: see the list of the builds in the job 'plan'.
on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'Distribution and release to build'
        type: choice
        default: all
        options: [ all, fedora-45, centos-9, centos-10 ]
      arch:
        description: 'Architecture to build (i686 only exists for Fedora)'
        type: choice
        default: all
        options: [ all, x86_64, i686, aarch64 ]
      publish:
        description: 'Publish the repository to GitHub Pages from this branch (it replaces the whole site by the selected builds)'
        type: boolean
        default: false
  push:
    paths:
      - '.github/rpm/cernlib/cernlib.spec'
  pull_request:
    paths:
      - '.github/rpm/cernlib/cernlib.spec'

concurrency:
  group: cernlib-rpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select the builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - name: Matrix of the builds (all, or those selected for a manual run)
      id: matrix
      env:
        DISTRO: ${{ inputs.distro || 'all' }}
        ARCH: ${{ inputs.arch || 'all' }}
      run: |
           python3 - <<'PY'
           import json, os
           fedora = 'fedora:45'
           c9, c10 = 'quay.io/centos/centos:stream9', 'quay.io/centos/centos:stream10'
           # arch: (runner, platform, qemu, docker options); i686 is built with mock in the x86_64 image (no i686 image of Fedora)
           hw = {
             'x86_64':  ('ubuntu-24.04',     'linux/amd64', '',      ''),
             'i686':    ('ubuntu-24.04',     'linux/amd64', '',      '--privileged'),
             'aarch64': ('ubuntu-24.04-arm', 'linux/arm64', '',      ''),
             's390x':   ('ubuntu-24.04',     'linux/s390x', 's390x', ''),
           }
           # s390x is disabled so far (emulated with QEMU it does not finish in time): add 's390x' to enable it again
           builds = [('fedora', 45, fedora, a) for a in ('x86_64', 'i686', 'aarch64')] \
                  + [('centos', 9, c9, a) for a in ('x86_64', 'aarch64')] \
                  + [('centos', 10, c10, a) for a in ('x86_64', 'aarch64')]
           want_d, want_a = os.environ['DISTRO'], os.environ['ARCH']
           include = []
           for distro, release, image, arch in builds:
               if want_d not in ('all', '%s-%d' % (distro, release)) or want_a not in ('all', arch):
                   continue
               runner, platform, qemu, opts = hw[arch]
               include.append(dict(distro=distro, release=release, image=image, arch=arch, runner=runner,
                                   platform=platform, qemu=qemu, docker_options=opts))
           if not include:
               raise SystemExit('no build for distro=%s arch=%s (CentOS has no i686, s390x is disabled)' % (want_d, want_a))
           with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
               out.write('matrix=' + json.dumps(dict(include=include)) + '\n')
           print(json.dumps(include, indent=1))
           PY

  rpm:
    name: CERNLIB RPMs ${{ matrix.distro }} ${{ matrix.release }} ${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    # s390x is emulated and may not finish within the time limit of a job: that does not stop the other architectures
    continue-on-error: ${{ matrix.arch == 's390x' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up QEMU
      if: matrix.qemu != ''
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ matrix.qemu }}
    - name: Build the RPMs in the image of the distribution
      run: |
           mkdir -p out
           docker run --rm --platform ${{ matrix.platform }} ${{ matrix.docker_options }} \
               -v "$PWD":/work -w /work ${{ matrix.image }} \
               bash .github/rpm/cernlib/build.sh ${{ matrix.arch }} /work/out
    - name: Upload the RPMs
      uses: actions/upload-artifact@v4
      with:
        name: rpm-${{ matrix.distro }}-${{ matrix.release }}-${{ matrix.arch }}
        path: out/*.rpm
        if-no-files-found: error

  repository:
    name: dnf repository on GitHub Pages
    needs: rpm
    # the architectures that were built are published, also if another one failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Download the RPMs
      uses: actions/download-artifact@v4
      with:
        pattern: rpm-*
        path: rpms
    - name: Create the repository
      run: |
           # <distro>/<release>/<arch>/ (binary packages of the architecture) and <distro>/<release>/SRPMS/ (source package)
           base=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
           for d in rpms/rpm-*; do
             name=${d#rpms/rpm-}                 # <distro>-<release>-<arch>
             distro=${name%%-*}; rest=${name#*-}
             release=${rest%%-*}; arch=${rest#*-}
             mkdir -p site/$distro/$release/$arch site/$distro/$release/SRPMS
             cp $d/*.rpm site/$distro/$release/$arch/
             mv site/$distro/$release/$arch/*.src.rpm site/$distro/$release/SRPMS/ 2>/dev/null || true
           done
           # one repository file per distribution: $releasever and $basearch are those of the machine
           for distro in fedora centos; do
             [ -d site/$distro ] || continue
             {
               echo "[jade-cernlib]"
               echo "name=CERNLIB of the JADE software for $distro \$releasever - \$basearch"
               echo "baseurl=$base/$distro/\$releasever/\$basearch/"
               echo "enabled=1"
               echo "gpgcheck=0"
             } > site/JADE-$distro.repo
           done
           {
             echo "<html><body><h1>CERNLIB RPMs</h1>"
             for distro in fedora centos; do
               [ -d site/$distro ] || continue
               echo "<h2>$distro</h2><p><code>dnf config-manager addrepo --from-repofile=$base/JADE-$distro.repo</code></p><ul>"
               for d in site/$distro/*/*/; do
                 echo "<li><a href=\"${d#site/}\">${d#site/}</a></li>"
               done
               echo "</ul>"
             done
             echo "</body></html>"
           } > site/index.html
           docker run --rm -v "$PWD/site":/site -w /site fedora:45 \
               sh -c 'dnf -y install createrepo_c && for d in */*/*/; do createrepo_c "$d"; done'
           sudo chown -R "$USER" site
           find site -maxdepth 4 | sort | head -80
    - name: Upload the site
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && inputs.publish)
      uses: actions/upload-pages-artifact@v3
      with:
        path: site
    - name: Deploy to GitHub Pages
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && inputs.publish)
      id: deployment
      uses: actions/deploy-pages@v4
